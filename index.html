<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>退水計算機 - 威爾設計工作室</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* 隱藏數字輸入框的上下箭頭 */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans pb-12">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md rounded-b-2xl mb-6 p-6 max-w-md mx-auto">
    <div class="flex items-center gap-3 mb-2">
      <i data-lucide="calculator" class="w-8 h-8 text-indigo-200"></i>
      <h1 class="text-2xl font-bold tracking-wider">運彩退水計算機</h1>
    </div>
    <p class="text-indigo-200 text-sm">專屬設計 for Wilson @ 威爾設計工作室</p>
  </header>

  <main class="max-w-md mx-auto px-4 space-y-6">
    
    <!-- 輸入表單 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
      <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
        <i data-lucide="plus" class="w-5 h-5 text-indigo-500"></i>
        新增投注紀錄
      </h2>
      <form id="recordForm" class="space-y-4">
        <div class="flex gap-3">
          <div class="flex-1">
            <label class="block text-xs font-medium text-slate-500 mb-1">日期</label>
            <div class="relative">
              <i data-lucide="calendar-days" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
              <input
                type="date"
                id="inputDate"
                class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm"
                required
              />
            </div>
          </div>
          <div class="flex-1">
            <label class="block text-xs font-medium text-slate-500 mb-1">投注金額</label>
            <div class="relative">
              <i data-lucide="dollar-sign" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
              <input
                type="number"
                id="inputAmount"
                min="1"
                placeholder="例如: 1000"
                class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm"
                required
              />
            </div>
          </div>
        </div>
        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors active:scale-[0.98] shadow-sm flex justify-center items-center gap-2"
        >
          加入計算
        </button>
      </form>
    </section>

    <!-- 月份切換與儀表板 -->
    <section class="space-y-4">
      <div class="flex items-center justify-between bg-white rounded-xl shadow-sm border border-slate-100 p-2">
        <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg transition-colors text-slate-600">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <span id="displayMonth" class="font-bold text-lg text-slate-700"></span>
        <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg transition-colors text-slate-600">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- 累計總額 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
          <div class="flex items-center gap-2 text-slate-500 mb-2">
            <i data-lucide="trending-up" class="w-4 h-4"></i>
            <span class="text-sm font-medium">累計總額</span>
          </div>
          <div id="totalAmount" class="text-2xl font-bold text-slate-800">
            $0
          </div>
        </div>
        
        <!-- 月退金 (2.5%) -->
        <div class="bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-2xl shadow-sm border border-emerald-400 p-5 text-white">
          <div class="flex items-center gap-2 text-emerald-100 mb-2">
            <i data-lucide="wallet" class="w-4 h-4"></i>
            <span class="text-sm font-medium">預估月退金 (2.5%)</span>
          </div>
          <div id="rebateAmount" class="text-3xl font-bold">
            $0
          </div>
        </div>
      </div>

      <!-- 入帳日期提示 -->
      <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 flex items-center gap-3 text-indigo-800">
        <div class="bg-indigo-100 p-2 rounded-full">
          <i data-lucide="calendar-check" class="w-5 h-5 text-indigo-600"></i>
        </div>
        <div>
          <p class="text-xs font-medium text-indigo-600 mb-0.5">預計入帳日期</p>
          <p id="payoutDate" class="font-bold"></p>
        </div>
      </div>
    </section>

    <!-- 紀錄列表 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
        <h3 class="font-semibold text-slate-700">當月明細</h3>
        <span id="recordCount" class="text-xs font-medium text-slate-500 bg-slate-200 px-2 py-1 rounded-full">
          共 0 筆
        </span>
      </div>
      <div id="recordList" class="p-2">
        <!-- 列表由 JS 動態生成 -->
      </div>
    </section>
  </main>

  <script>
    // 初始化 Lucide 圖示
    lucide.createIcons();

    // 取得今天日期的 YYYY-MM-DD
    const getTodayString = () => {
      const today = new Date();
      const tzOffset = today.getTimezoneOffset() * 60000; 
      return (new Date(Date.now() - tzOffset)).toISOString().split('T')[0];
    };

    // 狀態變數
    let records = JSON.parse(localStorage.getItem('lotteryRecords')) || [];
    let viewMonth = getTodayString().substring(0, 7);

    // DOM 元素綁定
    const form = document.getElementById('recordForm');
    const inputDate = document.getElementById('inputDate');
    const inputAmount = document.getElementById('inputAmount');
    
    // 初始化日期為今天
    inputDate.value = getTodayString();

    // 核心渲染函式
    function render() {
      // 1. 過濾並排序當月資料
      const filteredRecords = records.filter(r => r.date.startsWith(viewMonth));
      filteredRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

      // 2. 計算總額與退水
      const totalAmount = filteredRecords.reduce((sum, r) => sum + r.amount, 0);
      const rebateAmount = Math.floor(totalAmount * 0.025);

      // 3. 計算入帳日 (次月 5 號)
      let [year, month] = viewMonth.split('-').map(Number);
      let nextMonth = month + 1;
      let nextYear = year;
      if (nextMonth > 12) {
        nextMonth = 1;
        nextYear++;
      }
      const payoutDateStr = `${nextYear}年${nextMonth}月5日`;
      const displayMonthStr = `${year}年 ${month}月`;

      // 4. 更新畫面文字
      document.getElementById('displayMonth').innerText = displayMonthStr;
      document.getElementById('totalAmount').innerText = `$${totalAmount.toLocaleString()}`;
      document.getElementById('rebateAmount').innerText = `$${rebateAmount.toLocaleString()}`;
      document.getElementById('payoutDate').innerText = payoutDateStr;
      document.getElementById('recordCount').innerText = `共 ${filteredRecords.length} 筆`;

      // 5. 更新列表
      const listContainer = document.getElementById('recordList');
      if (filteredRecords.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-sm">
            這個月還沒有投注紀錄喔！
          </div>
        `;
      } else {
        let listHTML = '<ul class="space-y-1">';
        filteredRecords.forEach(record => {
          listHTML += `
            <li class="flex justify-between items-center p-3 hover:bg-slate-50 rounded-lg transition-colors group">
              <div class="flex flex-col">
                <span class="text-sm font-medium text-slate-700">${record.date}</span>
                <span class="text-xs text-emerald-600 font-medium">退水: +$${Math.floor(record.amount * 0.025)}</span>
              </div>
              <div class="flex items-center gap-4">
                <span class="font-bold text-slate-800">$${record.amount.toLocaleString()}</span>
                <button onclick="deleteRecord('${record.id}')" class="text-slate-300 hover:text-red-500 p-1 rounded transition-colors opacity-100 sm:opacity-0 sm:group-hover:opacity-100" title="刪除">
                  <i data-lucide="trash-2" class="w-4 h-4"></i>
                </button>
              </div>
            </li>
          `;
        });
        listHTML += '</ul>';
        listContainer.innerHTML = listHTML;
        
        // 重新渲染新加入的 icon
        lucide.createIcons();
      }
    }

    // 新增紀錄
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const amount = parseFloat(inputAmount.value);
      
      if (!inputDate.value || isNaN(amount) || amount <= 0) {
        alert('請輸入有效的日期與金額！');
        return;
      }

      const newRecord = {
        id: Date.now().toString(),
        date: inputDate.value,
        amount: amount
      };

      records.push(newRecord);
      localStorage.setItem('lotteryRecords', JSON.stringify(records));
      
      // 清空金額，保留日期
      inputAmount.value = '';
      
      // 自動切換到輸入的月份
      const recordMonth = inputDate.value.substring(0, 7);
      if (recordMonth !== viewMonth) {
        viewMonth = recordMonth;
      }
      
      render();
    });

    // 刪除紀錄 (掛載在 window 上讓行內 onclick 可以呼叫)
    window.deleteRecord = (id) => {
      records = records.filter(r => r.id !== id);
      localStorage.setItem('lotteryRecords', JSON.stringify(records));
      render();
    };

    // 切換月份
    window.changeMonth = (offset) => {
      let [year, month] = viewMonth.split('-').map(Number);
      month += offset;
      
      if (month > 12) {
        month = 1;
        year++;
      } else if (month < 1) {
        month = 12;
        year--;
      }
      
      viewMonth = `${year}-${month.toString().padStart(2, '0')}`;
      render();
    };

    // 初始渲染
    render();

  </script>
</body>
</html>
