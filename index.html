<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>運彩投注退水計算機 - 威爾設計工作室</title>
  
  <!-- 載入 Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- 載入 Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    /* 隱藏數字輸入框的上下箭頭 */
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="number"] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 font-sans pb-12">

  <!-- Header -->
  <header class="bg-indigo-600 text-white shadow-md rounded-b-2xl mb-6 p-6 max-w-md mx-auto">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-3">
        <i data-lucide="calculator" class="w-8 h-8 text-indigo-200"></i>
        <h1 class="text-2xl font-bold tracking-wider">運彩退水計算機</h1>
      </div>
    </div>
    <div class="flex flex-col gap-2 text-sm text-indigo-200">
      <p>專屬設計 for Wilson @ 威爾設計工作室</p>
      <div class="flex items-center gap-1.5 bg-indigo-500/50 w-fit px-2 py-1 rounded-md text-xs">
        <i data-lucide="cloud-sync" class="w-3.5 h-3.5"></i>
        <span id="syncStatus">連線中...</span>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-4 space-y-6">
    
    <!-- 輸入表單 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
      <h2 class="text-lg font-semibold mb-4 flex items-center gap-2">
        <i data-lucide="plus" class="w-5 h-5 text-indigo-500"></i>
        新增投注紀錄
      </h2>
      <form id="recordForm" class="space-y-4">
        <div class="flex gap-3">
          <div class="flex-1">
            <label class="block text-xs font-medium text-slate-500 mb-1">日期</label>
            <div class="relative">
              <i data-lucide="calendar-days" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
              <input
                type="date"
                id="inputDate"
                class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm"
                required
              />
            </div>
          </div>
          <div class="flex-1">
            <label class="block text-xs font-medium text-slate-500 mb-1">投注金額</label>
            <div class="relative">
              <i data-lucide="dollar-sign" class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400"></i>
              <input
                type="number"
                id="inputAmount"
                min="1"
                placeholder="例如: 1000"
                class="w-full pl-9 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all text-sm"
                required
              />
            </div>
          </div>
        </div>
        <button
          type="submit"
          class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition-colors active:scale-[0.98] shadow-sm flex justify-center items-center gap-2"
        >
          加入計算
        </button>
      </form>
    </section>

    <!-- 月份切換與儀表板 -->
    <section class="space-y-4">
      <div class="flex items-center justify-between bg-white rounded-xl shadow-sm border border-slate-100 p-2">
        <button onclick="changeMonth(-1)" class="p-2 hover:bg-slate-100 rounded-lg transition-colors text-slate-600">
          <i data-lucide="chevron-left" class="w-5 h-5"></i>
        </button>
        <span id="displayMonth" class="font-bold text-lg text-slate-700"></span>
        <button onclick="changeMonth(1)" class="p-2 hover:bg-slate-100 rounded-lg transition-colors text-slate-600">
          <i data-lucide="chevron-right" class="w-5 h-5"></i>
        </button>
      </div>

      <div class="grid grid-cols-2 gap-4">
        <!-- 累計總額 -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-100 p-5">
          <div class="flex items-center gap-2 text-slate-500 mb-2">
            <i data-lucide="trending-up" class="w-4 h-4"></i>
            <span class="text-sm font-medium">累計總額</span>
          </div>
          <div id="totalAmount" class="text-2xl font-bold text-slate-800">
            $0
          </div>
        </div>
        
        <!-- 月退金 (2.5%) -->
        <div class="bg-gradient-to-br from-emerald-500 to-emerald-600 rounded-2xl shadow-sm border border-emerald-400 p-5 text-white">
          <div class="flex items-center gap-2 text-emerald-100 mb-2">
            <i data-lucide="wallet" class="w-4 h-4"></i>
            <span class="text-sm font-medium">預估月退金 (2.5%)</span>
          </div>
          <div id="rebateAmount" class="text-3xl font-bold">
            $0
          </div>
        </div>
      </div>

      <!-- 入帳日期提示 -->
      <div class="bg-indigo-50 border border-indigo-100 rounded-xl p-4 flex items-center gap-3 text-indigo-800">
        <div class="bg-indigo-100 p-2 rounded-full">
          <i data-lucide="calendar-check" class="w-5 h-5 text-indigo-600"></i>
        </div>
        <div>
          <p class="text-xs font-medium text-indigo-600 mb-0.5">預計入帳日期</p>
          <p id="payoutDate" class="font-bold"></p>
        </div>
      </div>
    </section>

    <!-- 紀錄列表 -->
    <section class="bg-white rounded-2xl shadow-sm border border-slate-100 overflow-hidden">
      <div class="p-4 border-b border-slate-100 bg-slate-50 flex justify-between items-center">
        <h3 class="font-semibold text-slate-700">當月明細</h3>
        <span id="recordCount" class="text-xs font-medium text-slate-500 bg-slate-200 px-2 py-1 rounded-full">
          共 0 筆
        </span>
      </div>
      <div id="recordList" class="p-2">
        <!-- 列表由 JS 動態生成 -->
      </div>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // 初始化 Lucide 圖示
    lucide.createIcons();

    // 自訂提示框 (取代原生的 alert，讓體驗更現代)
    window.customAlert = (msg, type = 'error') => {
      const div = document.createElement('div');
      const bgColor = type === 'error' ? 'bg-red-500' : 'bg-emerald-500';
      const iconName = type === 'error' ? 'alert-circle' : 'check-circle';
      div.className = `fixed top-6 left-1/2 -translate-x-1/2 ${bgColor} text-white px-5 py-3 rounded-xl shadow-lg z-50 flex items-center gap-2 text-sm font-medium transition-all duration-300 opacity-0 translate-y-[-20px]`;
      div.innerHTML = `<i data-lucide="${iconName}" class="w-5 h-5"></i><span>${msg}</span>`;
      document.body.appendChild(div);
      lucide.createIcons();
      
      // 動畫進場
      requestAnimationFrame(() => {
        div.classList.remove('opacity-0', 'translate-y-[-20px]');
      });

      // 動畫退場與移除
      setTimeout(() => {
        div.classList.add('opacity-0', 'translate-y-[-20px]');
        setTimeout(() => div.remove(), 300)
      }, 3000);
    };

    // Firebase 雲端環境變數
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const initialToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

    // 初始化 Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // 取得今天日期的 YYYY-MM-DD
    const getTodayString = () => {
      const today = new Date();
      const tzOffset = today.getTimezoneOffset() * 60000; 
      return (new Date(Date.now() - tzOffset)).toISOString().split('T')[0];
    };

    // 狀態變數 (改由雲端接管)
    let records = [];
    let viewMonth = getTodayString().substring(0, 7);
    let expandedDates = new Set();
    let currentUser = null;
    let unsubscribeSnapshot = null;

    // DOM 元素綁定
    const form = document.getElementById('recordForm');
    const inputDate = document.getElementById('inputDate');
    const inputAmount = document.getElementById('inputAmount');
    const syncStatus = document.getElementById('syncStatus');
    
    // 初始化日期為今天
    inputDate.value = getTodayString();

    // 核心渲染函式
    window.render = function() {
      // 1. 過濾並排序當月資料
      const filteredRecords = records.filter(r => r.date.startsWith(viewMonth));
      filteredRecords.sort((a, b) => new Date(b.date) - new Date(a.date));

      // 2. 計算總額與退水
      const totalAmount = filteredRecords.reduce((sum, r) => sum + r.amount, 0);
      const rebateAmount = Math.floor(totalAmount * 0.025);

      // 3. 計算入帳日 (次月 5 號)
      let [year, month] = viewMonth.split('-').map(Number);
      let nextMonth = month + 1;
      let nextYear = year;
      if (nextMonth > 12) {
        nextMonth = 1;
        nextYear++;
      }
      const payoutDateStr = `${nextYear}年${nextMonth}月5日`;
      const displayMonthStr = `${year}年 ${month}月`;

      // 4. 更新畫面文字
      document.getElementById('displayMonth').innerText = displayMonthStr;
      document.getElementById('totalAmount').innerText = `$${totalAmount.toLocaleString()}`;
      document.getElementById('rebateAmount').innerText = `$${rebateAmount.toLocaleString()}`;
      document.getElementById('payoutDate').innerText = payoutDateStr;
      document.getElementById('recordCount').innerText = `共 ${filteredRecords.length} 筆`;

      // 5. 將資料按日期分組 (每日小計邏輯)
      const groupedData = {};
      filteredRecords.forEach(record => {
        if (!groupedData[record.date]) {
          groupedData[record.date] = { totalAmount: 0, totalRebate: 0, records: [] };
        }
        groupedData[record.date].records.push(record);
        groupedData[record.date].totalAmount += record.amount;
        groupedData[record.date].totalRebate += Math.floor(record.amount * 0.025);
      });

      // 取得排序後的日期清單 (由新到舊)
      const sortedDates = Object.keys(groupedData).sort((a, b) => new Date(b) - new Date(a));

      // 6. 更新列表 (包含小計與折疊明細功能)
      const listContainer = document.getElementById('recordList');
      if (sortedDates.length === 0) {
        listContainer.innerHTML = `
          <div class="text-center py-8 text-slate-400 text-sm">
            這個月還沒有投注紀錄喔！
          </div>
        `;
      } else {
        let listHTML = '<div class="space-y-3">';
        sortedDates.forEach(date => {
          const group = groupedData[date];
          const isExpanded = expandedDates.has(date);
          const chevronIcon = isExpanded ? 'chevron-up' : 'chevron-down';
          const detailClass = isExpanded ? 'block' : 'hidden';

          listHTML += `
            <div class="bg-white border border-slate-200 rounded-xl overflow-hidden shadow-sm transition-all">
              <!-- 每日小計 -->
              <button onclick="toggleDate('${date}')" class="w-full flex justify-between items-center p-3 bg-slate-50 hover:bg-slate-100 transition-colors text-left focus:outline-none">
                <div class="flex items-center gap-3">
                  <div class="p-1.5 bg-white rounded-lg shadow-sm border border-slate-100 text-slate-500">
                    <i data-lucide="${chevronIcon}" class="w-4 h-4"></i>
                  </div>
                  <span class="font-bold text-slate-700">${date}</span>
                </div>
                <div class="text-right">
                  <div class="font-bold text-slate-800">$${group.totalAmount.toLocaleString()}</div>
                  <div class="text-xs text-emerald-600 font-medium mt-0.5">退水: +$${group.totalRebate.toLocaleString()}</div>
                </div>
              </button>
              
              <!-- 明細列表 -->
              <div class="${detailClass} border-t border-slate-100 bg-white">
                <ul class="divide-y divide-slate-50">
          `;

          group.records.forEach(record => {
            listHTML += `
                  <li class="flex justify-between items-center p-3 pl-12 hover:bg-slate-50 transition-colors group">
                    <div class="flex items-center gap-2">
                      <span class="w-1.5 h-1.5 rounded-full bg-indigo-300"></span>
                      <span class="text-xs text-slate-500 font-medium">單筆明細</span>
                    </div>
                    <div class="flex items-center gap-4">
                      <span class="font-semibold text-slate-600">$${record.amount.toLocaleString()}</span>
                      <button onclick="deleteRecord('${record.id}')" class="text-slate-300 hover:text-red-500 p-1.5 rounded-md hover:bg-red-50 transition-all opacity-100 sm:opacity-0 sm:group-hover:opacity-100" title="刪除">
                        <i data-lucide="trash-2" class="w-4 h-4"></i>
                      </button>
                    </div>
                  </li>
            `;
          });

          listHTML += `
                </ul>
              </div>
            </div>
          `;
        });
        listHTML += '</div>';
        listContainer.innerHTML = listHTML;
        
        lucide.createIcons();
      }
    }

    // --- Firebase 雲端同步與驗證邏輯 ---
    const initAuth = async () => {
      try {
        if (initialToken) {
          await signInWithCustomToken(auth, initialToken);
        } else {
          await signInAnonymously(auth);
        }
      } catch (error) {
        console.error("驗證失敗:", error);
        syncStatus.innerText = "連線失敗";
        syncStatus.parentElement.classList.replace('bg-indigo-500/50', 'bg-red-500/50');
        window.customAlert('系統連線失敗，無法同步', 'error');
      }
    };

    onAuthStateChanged(auth, (user) => {
      currentUser = user;
      if (user) {
        syncStatus.innerText = `已連線 - 公開資料同步中`;
        
        // 監聽公開的雲端資料夾 (不再綁定特定的 user.uid)
        const recordsRef = collection(db, 'artifacts', appId, 'public', 'data', 'records');
        if (unsubscribeSnapshot) unsubscribeSnapshot();
        
        unsubscribeSnapshot = onSnapshot(recordsRef, (snapshot) => {
          records = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
          window.render();
        }, (error) => {
          console.error("讀取資料失敗:", error);
          window.customAlert('讀取雲端資料發生錯誤', 'error');
        });
      } else {
        syncStatus.innerText = "未連線";
        if (unsubscribeSnapshot) {
          unsubscribeSnapshot();
          unsubscribeSnapshot = null;
        }
        records = [];
        window.render();
      }
    });

    // 啟動身分驗證程序
    initAuth();

    // 新增紀錄 (寫入 Firestore)
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      if (!currentUser) {
        window.customAlert('系統尚未連線到雲端，請稍候');
        return;
      }

      const amount = parseFloat(inputAmount.value);
      
      if (!inputDate.value || isNaN(amount) || amount <= 0) {
        window.customAlert('請輸入有效的日期與金額！');
        return;
      }

      const newRecordId = Date.now().toString();
      const newRecord = {
        date: inputDate.value,
        amount: amount,
        createdAt: Date.now()
      };

      try {
        // 寫入到公開資料夾
        const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'records', newRecordId);
        await setDoc(docRef, newRecord);
        
        // 清空金額，保留日期
        inputAmount.value = '';
        window.customAlert('已同步新增至雲端！', 'success');
        
        // 自動切換到輸入的月份
        const recordMonth = inputDate.value.substring(0, 7);
        if (recordMonth !== viewMonth) {
          viewMonth = recordMonth;
          window.render();
        }
      } catch (error) {
        console.error("新增失敗:", error);
        window.customAlert("新增失敗，請檢查網路狀態");
      }
    });

    // 刪除紀錄 (從 Firestore 刪除)
    window.deleteRecord = async (id) => {
      if (!currentUser) return;
      try {
        // 從公開資料夾刪除
        await deleteDoc(doc(db, 'artifacts', appId, 'public', 'data', 'records', id));
        window.customAlert('明細已從雲端刪除', 'success');
      } catch (error) {
        console.error("刪除失敗:", error);
        window.customAlert("刪除失敗，請檢查網路狀態");
      }
    };

    // 展開/折疊日期明細
    window.toggleDate = (date) => {
      if (expandedDates.has(date)) {
        expandedDates.delete(date);
      } else {
        expandedDates.add(date);
      }
      window.render();
    };

    // 切換月份
    window.changeMonth = (offset) => {
      let [year, month] = viewMonth.split('-').map(Number);
      month += offset;
      
      if (month > 12) {
        month = 1;
        year++;
      } else if (month < 1) {
        month = 12;
        year--;
      }
      
      viewMonth = `${year}-${month.toString().padStart(2, '0')}`;
      window.render();
    };

    // 初始渲染
    window.render();

  </script>
</body>
</html>
